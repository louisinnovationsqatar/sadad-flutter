# Built by Louis Innovations (www.louis-innovations.com)
name: sadad_flutter
description: Flutter widgets for the SADAD Payment Gateway — Qatar's leading payment platform. Wraps the sadad_qatar Dart SDK with ready-to-use checkout buttons, embedded WebView, and payment status widgets.
version: 1.0.0
homepage: https://github.com/louis-innovations/sadad-flutter
repository: https://github.com/louis-innovations/sadad-flutter

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  sadad_qatar:
    path: ../sadad-dart-sdk
  webview_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
